<!doctype html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="mock-run.js"></script>
  <meta charset="utf-8">
  <script>
(function () {
  function show(msg) {
    var box = document.getElementById('bootError');
    if (!box) {
      box = document.createElement('div');
      box.id = 'bootError';
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;padding:12px 14px;border-radius:12px;background:#fff3f0;border:1px solid #e0a59a;color:#7a2a1d;font:13px/1.5 sans-serif;white-space:pre-wrap';
      box.textContent = '화면을 불러오지 못했어요. 새로고침해 주세요.\n';
      (document.body || document.documentElement).appendChild(box);
    }
    box.textContent += msg + '\n';
  }
  window.addEventListener('error', function (e) { show((e.message || '스크립트 오류') + (e.lineno ? ' (' + (e.filename || '').split('/').pop() + ' ' + e.lineno + ':' + e.colno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { show('처리 못 한 오류: ' + (e.reason && e.reason.message || e.reason)); });})();
</script>
  <title>G-DEAL 교사 해커톤</title>
  <meta name="theme-color" content="#66ae7d">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <style>
/* 디자인 값. 몬스터 원정대(legoschool.github.io/hanmadang-monster-battle) 첫 화면과
   gdeal.io에서 가져온 색·글꼴·모서리. 색을 바꾸려면 이 파일만 고친다. */

@font-face { font-family: 'Paperlogy'; font-weight: 400; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2'); }
@font-face { font-family: 'Paperlogy'; font-weight: 500; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2'); }
@font-face { font-family: 'Paperlogy'; font-weight: 600; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2'); }
@font-face { font-family: 'Paperlogy'; font-weight: 700; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2'); }
@font-face { font-family: 'Paperlogy'; font-weight: 800; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2'); }

:root {
  /* 글자 */
  --ink: #17382e;          /* 몬스터 원정대 본문 */
  --ink-2: #31543b;
  --ink-3: #5b7462;
  --ink-4: #8a9e8f;

  /* 지딜 초록 */
  --green: #66ae7d;        /* gdeal.io 주색 */
  --green-700: #497e56;
  --green-btn: #277849;    /* '참여하기' 버튼 */
  --green-btn-line: #245237;
  --green-btn-shadow: #153e29;
  --green-brand: #21754b;  /* 표지 G-DEAL 글자 */
  --green-50: #f1f8f3;
  --green-100: #e4ead8;
  --teal: #4ecdc4;

  /* 노란 버튼('이어서 플레이') */
  --gold: #f3cf69;
  --gold-line: #cfad4c;
  --gold-shadow: #ba983d;
  --gold-ink: #284b32;

  /* 어두운 게임 화면 */
  --screen: #102b23;
  --screen-2: #173a2f;
  --screen-line: #234b35;
  --screen-shadow: #b6c59c;
  --screen-ink: #e3f2e7;
  --screen-dim: #8fb39c;
  --screen-hi: #a6efc0;

  /* 판과 선 */
  --page-bg: linear-gradient(145deg, #f4f8e9 0%, #fff9e7 52%, #e8f4e9 100%);
  --hero-bg: linear-gradient(120deg, rgba(255, 254, 247, 0.92), rgba(230, 240, 217, 0.92));
  --card: rgba(255, 255, 255, 0.8);
  --card-solid: #fff;
  --line: #c8d9bb;
  --line-soft: #dfe9d5;
  --red: #d9473a;

  /* 모서리와 그림자 */
  --r-sm: 10px;
  --r: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --pill: 999px;
  --shadow-hero: 0 12px 0 -5px rgba(196, 214, 180, 0.5), 0 24px 44px rgba(38, 72, 45, 0.04);
  --shadow-card: 0 6px 0 -3px rgba(196, 214, 180, 0.45);
  --shadow-pop: 0 18px 40px rgba(23, 56, 46, 0.18);

  /* 글꼴 */
  --font: 'Paperlogy', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --pixel: 'Galmuri11', 'Paperlogy', monospace;

  --page-w: 1180px;
  --top-h: 64px;
}

/* 틀과 공용 부품: 위쪽 막대, 아래 메뉴, 버튼, 칩, 판, 입력칸, 아바타, 펫, 확인 창, 알림, 초안 도구 */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--page-bg) fixed;
  background-color: #f6f8ee;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; line-height: 1.3; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 3px solid rgba(78, 205, 196, 0.7); outline-offset: 2px; border-radius: 6px; }

.muted { color: var(--ink-4); font-weight: 500; }
.center { text-align: center; }
.clamp-2, .clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.clamp-2 { -webkit-line-clamp: 2; }
.clamp-3 { -webkit-line-clamp: 3; }
.eyebrow { display: inline-block; font-family: var(--pixel); font-size: 12px; letter-spacing: 0.02em; color: var(--green-700); }

/* ---------------------------------------------------------------- 위쪽 막대 */
.topbar {
  position: sticky; top: 0; z-index: 30;
  height: var(--top-h);
  display: flex; align-items: center; gap: 20px;
  padding: 0 max(20px, calc((100vw - var(--page-w)) / 2));
  background: rgba(247, 249, 238, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(200, 217, 187, 0.6);
}
.brand { display: flex; align-items: center; gap: 8px; flex: none; }
.brand img { display: block; width: 104px; height: auto; }
.brand span { font-family: var(--pixel); font-size: 13px; color: var(--green-700); padding-top: 2px; }
.topnav { display: flex; gap: 4px; }
.topnav a {
  padding: 8px 14px; border-radius: var(--pill);
  font-weight: 600; color: var(--ink-3);
  transition: background 0.15s, color 0.15s;
}
.topnav a:hover { background: var(--green-100); color: var(--ink); }
.topnav a.is-on { background: var(--green-btn); color: #fff; }
.day-chip {
  margin-left: auto;
  padding: 6px 14px; border-radius: var(--pill);
  background: var(--green-100);
  font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
}
.day-chip b { font-family: var(--pixel); font-weight: 400; color: var(--green-brand); margin-right: 4px; }
.sync { flex: none; font-family: var(--pixel); font-size: 11px; color: var(--green-700); animation: blink 1s steps(2) infinite; }
.sync[hidden] { display: none; }
@keyframes blink { 50% { opacity: 0.35; } }
.field__hint.is-error { color: var(--red); font-weight: 600; }
.me-box { flex: none; }
.day-chip:empty { display: none; }
.day-chip:empty ~ .me-box { margin-left: auto; }
.me {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 4px; border-radius: var(--pill);
  border: 1px solid var(--line); background: var(--card-solid); cursor: pointer;
}
.me span { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; text-align: left; }
.me b { font-size: 14px; }
.me small { font-size: 11px; color: var(--ink-3); }

/* ---------------------------------------------------------------- 아래 메뉴(휴대폰) */
.bottomnav { display: none; }

/* ---------------------------------------------------------------- 쪽 */
.page {
  max-width: calc(var(--page-w) + 40px);
  margin: 0 auto;
  padding: 24px 20px 80px;
  display: flex; flex-direction: column; gap: 20px;
}
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
.page-head h1 { font-size: 30px; font-weight: 800; }
.page-head p { margin-top: 2px; }
.back { align-self: flex-start; font-weight: 600; color: var(--ink-3); }
.back:hover { color: var(--ink); }

/* ---------------------------------------------------------------- 판 */
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px 22px;
  box-shadow: var(--shadow-card);
  min-width: 0;
}
.panel--soft { background: rgba(241, 248, 243, 0.8); box-shadow: none; }
.panel + .panel { margin-top: 0; }
.panel__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.panel__head h2 { font-size: 18px; font-weight: 700; }
.sub { font-size: 15px; font-weight: 700; margin: 18px 0 8px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.split > div { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.narrow { max-width: 820px; width: 100%; }

/* ---------------------------------------------------------------- 버튼 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 16px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--card-solid);
  font-weight: 700; font-size: 14px; color: var(--ink-2);
  cursor: pointer; white-space: nowrap;
  box-shadow: 0 3px 0 var(--line);
  transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
}
.btn:hover { background: var(--green-50); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn--primary { background: var(--green-btn); border-color: var(--green-btn-line); color: #fff; box-shadow: 0 3px 0 var(--green-btn-shadow); }
.btn--primary:hover { background: #2a8450; }
.btn--primary:active { box-shadow: 0 1px 0 var(--green-btn-shadow); }
.btn--ghost { background: transparent; box-shadow: none; }
.btn--sm { min-height: 32px; padding: 4px 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.link-btn {
  border: 0; background: none; padding: 4px 2px; cursor: pointer;
  font-weight: 700; font-size: 13px; color: var(--green-700);
}
.link-btn:hover { color: var(--green-brand); text-decoration: underline; }
.link-btn--quiet { color: var(--ink-4); font-weight: 600; }
.link-btn--danger { color: var(--red); }

/* 몬스터 원정대 첫 화면의 큰 버튼 */
.big-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.big {
  position: relative; overflow: hidden;
  display: flex; align-items: center; min-height: 76px;
  padding: 18px 22px; border-radius: 18px; border: 2px solid; cursor: pointer;
  text-align: left; font: inherit;
  transition: transform 0.08s, box-shadow 0.08s;
}
.big strong { display: flex; align-items: center; gap: 10px; font-size: clamp(20px, 2.6vw, 27px); font-weight: 700; }
.big:active { transform: translateY(3px); }
.big--green { background: var(--green-btn); border-color: var(--green-btn-line); color: #fff; box-shadow: 0 5px 0 var(--green-btn-shadow); }
.big--green:active { box-shadow: 0 2px 0 var(--green-btn-shadow); }
.big--gold { background: var(--gold); border-color: var(--gold-line); color: var(--gold-ink); box-shadow: 0 5px 0 var(--gold-shadow); }
.big--gold:active { box-shadow: 0 2px 0 var(--gold-shadow); }
.big__pet { width: auto; height: 46px; margin: -10px 0; }

/* ---------------------------------------------------------------- 칩·태그 */
.filters { display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: var(--pill);
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.7);
  font-size: 13px; font-weight: 600; color: var(--ink-3); cursor: pointer;
}
.chip:hover { border-color: var(--green); color: var(--ink); }
.chip.is-on { background: var(--green-btn); border-color: var(--green-btn); color: #fff; }
.chip--kind.is-on { background: var(--k); border-color: var(--k); }
.chip--team { padding-left: 4px; }
.chip--team.is-on { background: var(--c); border-color: var(--c); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  display: inline-block; padding: 1px 8px; border-radius: 6px;
  background: var(--green-100); font-size: 12px; font-weight: 600; color: var(--ink-2);
}
.tag--level { background: #fff3d0; color: #7a5a10; }
.tag--warn { background: #fde4e0; color: var(--red); }
.warn { color: var(--red); font-style: normal; font-weight: 700; }
.kind {
  display: inline-block; padding: 1px 8px; border-radius: 6px;
  background: color-mix(in srgb, var(--k) 14%, white); color: var(--k);
  font-size: 12px; font-weight: 700; white-space: nowrap;
}
.lv {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  background: var(--screen); color: var(--screen-hi);
  font-family: var(--pixel); font-size: 12px; line-height: 1.5; white-space: nowrap;
  box-shadow: 0 2px 0 color-mix(in srgb, var(--c, var(--green)) 70%, black);
}
.stepbar { display: inline-flex; gap: 3px; }
.stepbar i { width: 14px; height: 10px; border-radius: 2px; background: var(--line-soft); }
.stepbar i.on { background: var(--c); }

/* ---------------------------------------------------------------- 펫·아바타 */
.pet { display: block; width: auto; height: 64px; object-fit: contain; user-select: none; }
.pet--xs { height: 24px; max-width: 34px; }
.pet--sm { height: 48px; }
.pet--md { height: 72px; max-width: 96px; }
.ava {
  flex: none; display: inline-block; position: relative; overflow: hidden;
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(160deg, #eef6e4, #d8ead0);
  border: 1.5px solid #fff; box-shadow: 0 0 0 1px var(--line);
}
.ava img { position: absolute; left: 50%; top: 4%; width: 165%; max-width: none; transform: translateX(-50%); }
.ava--xs { width: 26px; height: 26px; }
.ava--sm { width: 32px; height: 32px; }
.body { display: block; height: 72px; width: auto; user-select: none; }
.who { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.who > span { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.who b { font-size: 14px; }
.who small { font-size: 12px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stack { display: flex; align-items: center; }
.stack .ava + .ava { margin-left: -8px; }
.stack .muted { margin-left: auto; font-size: 12px; }
.team-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 10px 2px 4px; border-radius: var(--pill);
  background: color-mix(in srgb, var(--c) 14%, white);
  border: 1px solid color-mix(in srgb, var(--c) 35%, white);
  font-size: 13px; font-weight: 700; color: var(--ink);
}
.team-tag:hover { background: color-mix(in srgb, var(--c) 24%, white); }

/* ---------------------------------------------------------------- 입력칸 */
.form-card { display: flex; flex-direction: column; gap: 14px; }
.form-card .panel__head { margin-bottom: 0; }
.field { display: flex; flex-direction: column; gap: 4px; border: 0; margin: 0; padding: 0; min-width: 0; }
.field__label { font-weight: 700; font-size: 14px; color: var(--ink-2); padding: 0; }
.field__label em { font-style: normal; font-size: 11px; color: var(--red); margin-left: 4px; }
.field__hint { font-size: 12px; color: var(--ink-4); }
input[type="text"], input[type="url"], input[type="search"], input[type="email"], input:not([type]), select, textarea {
  width: 100%; min-height: 42px;
  padding: 9px 12px;
  border: 1.5px solid var(--line); border-radius: 12px;
  background: #fff; font-size: 15px; line-height: 1.5;
}
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(102, 174, 125, 0.2); }
.field-row { display: grid; grid-template-columns: 180px 1fr; gap: 16px; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; }
.inline-form { display: flex; gap: 8px; margin-top: 10px; }
.inline-form input { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.inline-form .w-short { width: 110px; flex: none; }
.check-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.check-chip input { position: absolute; opacity: 0; pointer-events: none; }
.check-chip span {
  display: inline-block; padding: 6px 12px; border-radius: var(--pill);
  border: 1px solid var(--line); background: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
}
.check-chip input:checked + span { background: var(--green-btn); border-color: var(--green-btn); color: #fff; }
.check-chip input:focus-visible + span { outline: 3px solid rgba(78, 205, 196, 0.7); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------------------------------------------------------------- 안내·빈 상태 */
.notice {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 16px; border-radius: var(--r);
  background: #fff8e2; border: 1px solid #ecd9a0; font-weight: 600; color: #6b5212;
}
.notice--team { background: color-mix(in srgb, var(--c) 12%, white); border-color: color-mix(in srgb, var(--c) 40%, white); color: var(--ink); }
.notice--team .link-btn { margin-left: auto; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 12px; text-align: center; color: var(--ink-3); }
.empty .pet { opacity: 0.9; }

/* ---------------------------------------------------------------- 댓글 */
.comments { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.comments li { display: flex; gap: 8px; align-items: flex-start; }
.comments li > div { background: var(--green-50); border-radius: 4px 12px 12px 12px; padding: 7px 12px; font-size: 14px; min-width: 0; }
.comments li > div p:first-child { font-size: 13px; }

/* ---------------------------------------------------------------- 확인 창·알림 */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgba(16, 43, 35, 0.4); }
.modal__box { width: min(420px, 100%); padding: 22px; border-radius: var(--r-lg); background: #fff; box-shadow: var(--shadow-pop); }
.modal__box p { font-weight: 600; margin-bottom: 18px; }
.toast-root { position: fixed; left: 50%; bottom: 28px; z-index: 70; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
  padding: 10px 18px; border-radius: var(--pill);
  background: var(--screen); color: var(--screen-ink); font-weight: 600; font-size: 14px;
  box-shadow: 0 4px 0 var(--screen-shadow); transition: opacity 0.4s, transform 0.4s;
}
.toast.is-out { opacity: 0; transform: translateY(6px); }

/* ---------------------------------------------------------------- 초안 도구 */
.draft { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.draft__btn {
  order: 2; padding: 8px 14px; border-radius: var(--pill); cursor: pointer;
  border: 1px dashed #b58a1d; background: #fff7dc; color: #7a5a10;
  font-family: var(--pixel); font-size: 12px;
}
.draft__panel {
  order: 1; width: min(340px, calc(100vw - 32px));
  display: flex; flex-direction: column; gap: 14px;
  padding: 16px; border-radius: var(--r);
  border: 1px dashed #b58a1d; background: #fffdf4; box-shadow: var(--shadow-pop);
}
.draft__panel header { display: flex; justify-content: space-between; align-items: center; }
.draft__panel .link-btn { font-size: 18px; line-height: 1; }

/* ---------------------------------------------------------------- 좁은 화면 */
@media (max-width: 900px) {
  .topnav { display: none; }
  .bottomnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, 0.95); border-top: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .bottomnav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 11px; font-weight: 600; color: var(--ink-4); }
  .bottomnav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bottomnav a.is-on { color: var(--green-btn); }
  .page { padding-bottom: 110px; }
  .draft { bottom: calc(72px + env(safe-area-inset-bottom)); left: 12px; right: auto; align-items: flex-start; }
  .toast-root { bottom: 90px; }
  .cols, .split { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .topbar { gap: 10px; padding: 0 14px; }
  .brand img { width: 86px; }
  .brand span { display: none; }
  .day-chip { padding: 5px 10px; font-size: 12px; }
  .me small { display: none; }
  .me { padding-right: 10px; }
  .page { padding: 16px 16px 110px; gap: 16px; }
  .page-head h1 { font-size: 24px; }
  .panel { padding: 16px; border-radius: var(--r); }
  .big-actions { gap: 10px; }
  .big { min-height: 64px; padding: 14px 16px; }
  .field-row { grid-template-columns: 1fr; }
  .inline-form { flex-wrap: wrap; }
  .inline-form input { flex: 1 1 160px; }
}

/* 화면별 모양. 위에서부터 홈, 아이디어, 팀, 팀 공간, 과정 기록 카드, 아카이브 순서 */

/* ================================================================ 홈 */
.hero {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 28px; align-items: stretch;
  padding: 30px 32px;
  background: var(--hero-bg);
  border: 1px solid #c9dfba; border-radius: var(--r-xl);
  box-shadow: var(--shadow-hero);
}
.hero__text { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hero h1 { display: flex; flex-direction: column; line-height: 1.1; }
.hero__brand { font-size: clamp(44px, 6vw, 62px); font-weight: 900; color: var(--green-brand); letter-spacing: -0.02em; }
.hero h1 em { font-style: normal; font-size: clamp(28px, 3.4vw, 38px); font-weight: 700; color: #254832; margin-top: 4px; }
.hero__when { font-size: 18px; font-weight: 500; color: #435c42; line-height: 1.55; }
.hero__party { display: flex; align-items: flex-end; gap: 12px; margin-top: auto; padding-top: 10px; }
.hero__pet { height: 84px; width: auto; filter: drop-shadow(0 6px 4px rgba(38, 72, 45, 0.15)); }
.hero__me { height: 104px; width: auto; filter: drop-shadow(0 6px 4px rgba(38, 72, 45, 0.15)); }
.hero__party .hero__pet:nth-child(2) { animation: bob 2.6s ease-in-out infinite; }
.hero__party .hero__pet:nth-child(3) { animation: bob 2.6s ease-in-out 0.8s infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }

.screen {
  display: flex; flex-direction: column; gap: 16px;
  padding: 18px 20px;
  background: var(--screen); color: var(--screen-ink);
  border: 3px solid var(--screen-line); border-radius: 18px;
  box-shadow: 0 8px 0 var(--screen-shadow);
  min-width: 0;
}
.screen__top { display: flex; justify-content: space-between; align-items: center; font-family: var(--pixel); font-size: 12px; color: var(--screen-dim); }
.screen__top b { font-weight: 400; color: #10251d; background: var(--screen-hi); padding: 2px 8px; border-radius: 4px; }
.phases { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.phases > li {
  position: relative; padding: 12px; border-radius: 12px;
  background: var(--screen-2); border: 1px solid var(--screen-line);
}
.phases > li b { display: block; font-size: 17px; }
.phases > li small { display: block; font-family: var(--pixel); font-size: 11px; color: var(--screen-dim); }
.phases > li b { margin-bottom: 6px; }
.phases ul { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--screen-dim); }
.phases ul li::before { content: '· '; }
.phases > li.is-now { background: #1f5139; border-color: var(--screen-hi); box-shadow: 0 0 0 1px var(--screen-hi) inset; }
.phases > li.is-now ul { color: var(--screen-ink); }
.phases > li.is-now b { color: var(--screen-hi); }
.phases > li.is-done { opacity: 0.6; }
.screen__stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: auto 0 0; }
.screen__stats div { padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); }
.screen__stats dt { font-size: 11px; color: var(--screen-dim); }
.screen__stats dd { margin: 0; font-family: var(--pixel); font-size: 22px; color: var(--screen-hi); line-height: 1.3; }

/* 팀 진행판 */
.tracks { display: flex; flex-direction: column; gap: 4px; }
.tracks__legend, .track { display: grid; grid-template-columns: 190px minmax(0, 1fr) 54px; gap: 14px; align-items: center; }
.tracks__legend { padding: 0 12px 4px; }
.tracks__legend .track__nodes { display: grid; grid-template-columns: repeat(6, 1fr); }
.tracks__legend small { font-size: 11px; color: var(--ink-4); text-align: center; font-weight: 600; }
.track { padding: 8px 12px; border-radius: 12px; transition: background 0.15s; }
.track:hover { background: color-mix(in srgb, var(--c) 9%, white); }
.track__team { display: flex; align-items: center; gap: 8px; min-width: 0; }
.track__team b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track__team .pet--xs { width: 34px; object-fit: contain; }
.track > .track__nodes { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); height: 34px; align-items: center; }
.track > .track__nodes::before {
  content: ''; position: absolute; left: 8.33%; right: 8.33%; top: 50%; height: 4px; margin-top: -2px;
  background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px);
}
.track > .track__nodes i {
  position: relative; justify-self: center; width: 14px; height: 14px; border-radius: 3px;
  background: #fff; border: 2px solid var(--line);
}
.track > .track__nodes i.on { background: var(--c); border-color: color-mix(in srgb, var(--c) 70%, black); }
.track__runner {
  position: absolute; top: 50%; z-index: 1;
  left: calc((max(var(--lv), 1) - 0.5) / 6 * 100%);
  transform: translate(-50%, -78%);
  transition: left 0.6s cubic-bezier(.3, 1.4, .5, 1);
}
.track__runner .pet { height: 34px; max-width: 46px; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.18)); }
.track__lv { font-family: var(--pixel); font-size: 13px; color: var(--ink-2); text-align: right; }

.mini-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.mini-list li + li { border-top: 1px solid var(--line-soft); }
.mini-list a { display: flex; gap: 10px; align-items: flex-start; padding: 10px 4px; border-radius: 10px; }
.mini-list a:hover { background: var(--green-50); }
.mini-list a > span { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 14px; color: var(--ink-2); }
.mini-list .pet--xs { width: 34px; flex: none; margin-top: 2px; }
.mini-list__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.mini-list__meta b { color: var(--ink); font-size: 14px; }
.mini-list__count {
  flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px;
  background: var(--gold); color: var(--gold-ink); font-family: var(--pixel); font-size: 15px;
  box-shadow: 0 3px 0 var(--gold-shadow);
}

.disclosure { background: rgba(255, 255, 255, 0.72); border: 1px solid var(--line); border-radius: var(--r); padding: 0 18px; }
.disclosure summary { display: flex; align-items: center; gap: 12px; padding: 18px 0; cursor: pointer; list-style: none; color: #31543b; }
.disclosure summary::-webkit-details-marker { display: none; }
.disclosure summary b { font-size: 17px; }
.disclosure summary span { font-size: 13px; color: var(--ink-4); }
.disclosure summary::after {
  content: '+'; margin-left: auto; display: grid; place-items: center; width: 28px; height: 28px;
  border-radius: 8px; background: var(--green-100); font-weight: 700;
}
.disclosure[open] summary::after { content: '−'; }
.howto-steps { list-style: none; margin: 0 0 18px; padding: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.howto-steps li { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 12px; background: var(--green-50); }
.howto-steps span { font-family: var(--pixel); font-size: 12px; color: var(--green-700); }
.howto-steps b { font-size: 15px; }
.howto-steps small { font-size: 12px; color: var(--ink-3); }

/* ================================================================ 아이디어 */
.idea-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.idea {
  display: flex; flex-direction: column; gap: 10px;
  padding: 18px 20px; border-radius: var(--r-lg);
  background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card);
}
.idea__head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.idea h3 { font-size: 19px; font-weight: 700; }
.idea h3 a:hover { color: var(--green-brand); }
.idea__problem { color: var(--ink-2); }
.idea__wish { padding: 10px 12px; border-radius: 10px; background: #fff8e2; font-size: 14px; color: #5d4a12; }
.idea__wish b { display: block; font-size: 12px; color: #9a6a00; margin-bottom: 2px; }
.idea__foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid var(--line-soft); }
.idea__teams { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; font-size: 13px; }
.idea--full { padding: 24px 26px; }
.idea--full h3 { font-size: 24px; }
.detail-wrap { display: flex; flex-direction: column; gap: 16px; max-width: 820px; width: 100%; }
.like, .cheer {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: var(--pill); cursor: pointer;
  border: 1.5px solid var(--line); background: #fff;
  font-size: 13px; font-weight: 700; color: var(--ink-3);
  box-shadow: 0 2px 0 var(--line);
}
.like b, .cheer b { font-family: var(--pixel); font-weight: 400; }
.like:active, .cheer:active { transform: translateY(1px); box-shadow: none; }
.like.is-on, .cheer.is-on { background: var(--gold); border-color: var(--gold-line); color: var(--gold-ink); box-shadow: 0 2px 0 var(--gold-shadow); }

/* ================================================================ 팀 */
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
.team-card {
  display: flex; flex-direction: column;
  border-radius: var(--r-lg); overflow: hidden;
  background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card);
}
.team-card__top {
  display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 22%, white), color-mix(in srgb, var(--c) 6%, white));
}
.team-card__top .pet { flex: none; }   /* 반복되는 카드에는 drop-shadow를 걸지 않는다(그리기가 느려짐) */
.team-card__name { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.team-card__name b { font-size: 19px; font-weight: 700; }
.team-card__name small { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-card__top .lv { align-self: flex-start; }
.team-card__foot { display: flex; align-items: center; gap: 10px; padding: 10px 18px 14px; margin-top: auto; }
.team-card__foot .btn { margin-left: auto; }
.team-card__foot .muted { font-size: 13px; }

.party {
  display: flex; align-items: flex-end; gap: 4px; padding: 12px 14px 6px;
  overflow-x: auto; scrollbar-width: none;
}
.seat { flex: 1 0 58px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.seat .body { height: 66px; }
.seat small { font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.seat small em { font-style: normal; font-size: 10px; color: #fff; background: var(--green-700); padding: 0 4px; border-radius: 4px; margin-left: 2px; }
.seat--empty i { display: block; width: 36px; height: 62px; border-radius: 18px 18px 8px 8px; border: 2px dashed var(--line); }
.seat--empty small { color: var(--ink-4); }
.seat--facil { border-left: 1px dashed var(--line); padding-left: 6px; }

.pet-pick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pet-pick__item {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 4px 8px; border-radius: 14px; cursor: pointer;
  border: 2px solid var(--line-soft); background: #fff; text-align: center;
}
.pet-pick__item input { position: absolute; opacity: 0; pointer-events: none; }
.pet-pick__item .pet { height: 54px; max-width: 74px; }
.pet-pick__item b { font-size: 13px; }
.pet-pick__item small { font-size: 11px; color: var(--ink-4); }
.pet-pick__item:has(input:checked) { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, white); box-shadow: 0 3px 0 var(--c); }
.pet-pick__item:has(input:focus-visible) { outline: 3px solid rgba(78, 205, 196, 0.7); }
.pet-pick__item.is-taken { cursor: not-allowed; opacity: 0.45; filter: grayscale(0.7); }

.people { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 16px; }
.people li { display: flex; align-items: center; gap: 8px; min-width: 0; }

/* ================================================================ 팀 공간 */
.team-hero {
  display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 340px); gap: 24px; align-items: center;
  padding: 24px 26px; border-radius: var(--r-xl);
  background: linear-gradient(120deg, color-mix(in srgb, var(--c) 20%, #fffef7), color-mix(in srgb, var(--c) 5%, #fffef7));
  border: 1px solid color-mix(in srgb, var(--c) 40%, white);
  box-shadow: 0 12px 0 -5px color-mix(in srgb, var(--c) 30%, white);
}
.team-hero__pet { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.team-hero__pet .pet { height: 120px; max-width: 150px; filter: drop-shadow(0 8px 5px rgba(0, 0, 0, 0.15)); animation: bob 2.8s ease-in-out infinite; }
.team-hero__pet .lv { font-size: 14px; padding: 3px 10px; }
.team-hero__main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.team-hero h1 { font-size: 32px; font-weight: 800; }
.team-hero__idea { font-size: 14px; color: var(--ink-3); }
.team-hero__idea a { font-weight: 700; color: var(--ink); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--c) 60%, white); text-underline-offset: 3px; }
.team-hero .party { padding: 8px 0 0; }
.team-hero__btns { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.team-hero__steps { padding: 14px 16px; border-radius: 16px; background: var(--screen); color: var(--screen-ink); border: 3px solid var(--screen-line); box-shadow: 0 6px 0 var(--screen-shadow); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.steps li { display: grid; grid-template-columns: 14px 1fr; column-gap: 8px; align-items: center; }
.steps i { grid-row: span 2; width: 14px; height: 14px; border-radius: 3px; border: 2px solid var(--screen-line); background: transparent; }
.steps li.on i { background: var(--c); border-color: var(--c); }
.steps b { font-size: 13px; font-weight: 600; }
.steps small { font-family: var(--pixel); font-size: 10px; color: var(--screen-dim); }
.steps li:not(.on) b { color: var(--screen-dim); }
.next { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--screen-line); font-size: 13px; color: var(--screen-dim); }
.next b { color: var(--screen-hi); font-weight: 600; }

.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255, 255, 255, 0.6); border: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs a { flex: 1 0 auto; text-align: center; padding: 9px 16px; border-radius: 10px; font-weight: 700; color: var(--ink-3); white-space: nowrap; }
.tabs a:hover { background: var(--green-50); color: var(--ink); }
.tabs a.is-on { background: var(--green-btn); color: #fff; box-shadow: 0 3px 0 var(--green-btn-shadow); }
.tabs a span { font-family: var(--pixel); font-size: 12px; font-weight: 400; opacity: 0.8; }
.tab-body { display: flex; flex-direction: column; gap: 20px; }

.plan { margin: 0; display: grid; gap: 14px; }
.plan dt { font-size: 13px; font-weight: 700; color: var(--green-700); }
.plan dd { margin: 2px 0 0; font-size: 15px; }
.roles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.roles li { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 12px; background: var(--green-50); font-size: 14px; }
.roles li span { color: var(--ink-3); }
.roles-edit { display: grid; gap: 8px; }
.roles-edit label { display: grid; grid-template-columns: auto 64px 1fr; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.roles-edit input { min-height: 36px; padding: 6px 10px; }

.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.todo li { display: grid; grid-template-columns: 22px 1fr auto auto; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 8px; }
.todo li:hover { background: var(--green-50); }
.todo__box { width: 20px; height: 20px; padding: 0; border-radius: 5px; border: 2px solid var(--line); background: #fff; cursor: pointer; }
span.todo__box { cursor: default; }
.todo li.is-done .todo__box { background: var(--green-btn); border-color: var(--green-btn); box-shadow: inset 0 0 0 3px #fff; }
.todo li.is-done .todo__text { color: var(--ink-4); text-decoration: line-through; }
.todo small { font-size: 12px; color: var(--ink-4); white-space: nowrap; }

.composer { display: flex; flex-direction: column; gap: 10px; }
.composer__row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.composer__row input[type="url"] { flex: 1 1 220px; width: auto; min-height: 40px; }
.composer__row > .btn--primary { margin-left: auto; }
.composer__preview { display: inline-flex; align-items: center; gap: 6px; }
.composer__preview img { height: 44px; width: auto; border-radius: 8px; border: 1px solid var(--line); }
.log-col { display: flex; flex-direction: column; gap: 14px; max-width: 820px; width: 100%; }

.intent { display: flex; flex-direction: column; gap: 14px; }
.intent__item { padding: 14px 16px; border-radius: 14px; background: var(--green-50); border-left: 4px solid var(--green); }
.intent__item h3 { font-size: 13px; color: var(--green-700); margin-bottom: 4px; }
.intent__item p { font-size: 16px; line-height: 1.7; }
.intent--row { display: grid; grid-template-columns: repeat(3, 1fr); }

.cover {
  position: relative; display: grid; place-items: center; overflow: hidden;
  aspect-ratio: 16 / 9; border-radius: 16px;
  background:
    radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.55), transparent 55%),
    linear-gradient(135deg, color-mix(in srgb, var(--c) 40%, white), color-mix(in srgb, var(--c) 75%, #10251d));
}
.cover .pet { height: 62%; max-width: 70%; filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.2)); }
.cover img:not(.pet) { width: 100%; height: 100%; object-fit: cover; }
.work-card { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
.work-card__body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.work-card__body .panel__head { margin-bottom: 0; }
.work-card__body h2 { font-size: 22px; }
.work-card__one { font-size: 16px; color: var(--ink-2); }
.howto { margin: 0; padding: 0; list-style: none; counter-reset: step; display: flex; flex-direction: column; gap: 6px; }
.howto li { counter-increment: step; display: flex; gap: 10px; align-items: baseline; }
.howto li::before {
  content: counter(step); flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px;
  background: var(--screen); color: var(--screen-hi); font-family: var(--pixel); font-size: 12px;
}
.publish h2 { font-size: 17px; }
.publish.is-on { background: color-mix(in srgb, var(--green) 10%, white); border-color: var(--green); }
.publish p { font-size: 14px; margin-bottom: 10px; }
.checks { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.checks li { display: flex; align-items: center; gap: 8px; color: var(--ink-4); }
.checks li::before { content: ''; width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--line); }
.checks li.ok { color: var(--ink); font-weight: 600; }
.checks li.ok::before { background: var(--green-btn); border-color: var(--green-btn); box-shadow: inset 0 0 0 3px #fff; }

/* ================================================================ 과정 기록 카드 */
.log {
  display: flex; flex-direction: column; gap: 10px;
  padding: 16px 18px; border-radius: var(--r-lg);
  background: var(--card-solid); border: 1px solid var(--line); box-shadow: var(--shadow-card);
}
.log__team { margin: -4px 0 0; }
.log__head { display: flex; align-items: center; gap: 10px; }
.log__head .link-btn { margin-left: auto; }
.log__who { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 14px; }
.log__who .muted { font-size: 12px; }
.log__text { font-size: 15px; line-height: 1.7; }
.log__img { display: block; max-height: 320px; width: auto; max-width: 100%; border-radius: 12px; border: 1px solid var(--line-soft); }
.log__link { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--green-700); }
.log__foot { display: flex; align-items: center; gap: 10px; }

/* ================================================================ 아카이브 */
input.search { width: min(320px, 100%); }
.arc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }
.arc-card {
  display: flex; flex-direction: column; overflow: hidden;
  border-radius: var(--r-lg); background: var(--card-solid); border: 1px solid var(--line);
  box-shadow: var(--shadow-card); transition: transform 0.15s, box-shadow 0.15s;
}
.arc-card:hover { transform: translateY(-3px); box-shadow: 0 10px 0 -4px color-mix(in srgb, var(--c) 45%, white); }
.arc-card .cover { border-radius: 0; }
.arc-card__body { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px; flex: 1; }
.arc-card__body h3 { font-size: 18px; }
.arc-card__body p { font-size: 14px; color: var(--ink-3); }
.arc-card__body .stack { margin-top: auto; padding-top: 6px; }

.work { display: flex; flex-direction: column; gap: 18px; }
.work__hero {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 26px; align-items: center;
  padding: 22px; border-radius: var(--r-xl);
  background: var(--hero-bg); border: 1px solid #c9dfba; box-shadow: var(--shadow-hero);
}
.work__head { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.work__head h1 { font-size: clamp(26px, 3.4vw, 36px); font-weight: 800; }
.work__one { font-size: 17px; color: var(--ink-2); }
.work__sec { padding: 22px 24px; border-radius: var(--r-lg); background: var(--card); border: 1px solid var(--line); }
.work__sec > h2 { font-size: 19px; margin-bottom: 14px; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ''; position: absolute; left: 77px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.timeline li { position: relative; display: grid; grid-template-columns: 64px 1fr; gap: 28px; padding: 6px 0 14px; }
.timeline li::before {
  content: ''; position: absolute; left: 71px; top: 11px; width: 14px; height: 14px; border-radius: 3px;
  background: var(--k); box-shadow: 0 0 0 3px #fff;
}
.timeline__when { font-family: var(--pixel); font-size: 12px; color: var(--ink-3); text-align: right; padding-top: 3px; }
.timeline__meta { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-size: 13px; }

/* ================================================================ 좁은 화면 */
@media (max-width: 1000px) {
  .team-hero { grid-template-columns: 120px minmax(0, 1fr); }
  .team-hero__steps { grid-column: 1 / -1; }
  .team-hero__pet .pet { height: 96px; }
  .howto-steps { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; }
  .hero__party { margin-top: 0; padding-top: 4px; }
  .work__hero, .work-card { grid-template-columns: 1fr; }
  .intent--row { grid-template-columns: 1fr; }
  .tracks__legend { display: none; }
  .track { grid-template-columns: 150px minmax(0, 1fr) 44px; gap: 10px; }
}
@media (max-width: 560px) {
  .hero { padding: 22px 18px; gap: 20px; border-radius: 22px; }
  .hero__when { font-size: 16px; }
  .hero__pet { height: 64px; }
  .hero__me { height: 82px; }
  .phases { grid-template-columns: 1fr; }
  .phases > li { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: baseline; padding: 10px 12px; }
  .phases > li ul { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0 10px; }
  .screen__stats { grid-template-columns: repeat(2, 1fr); }
  .track { grid-template-columns: 1fr 44px; row-gap: 2px; padding: 8px; }
  .track > .track__nodes { grid-column: 1 / -1; grid-row: 2; }
  .track__lv { grid-column: 2; grid-row: 1; }
  .howto-steps { grid-template-columns: repeat(2, 1fr); }
  .idea-grid, .team-grid, .arc-grid { grid-template-columns: 1fr; }
  .team-hero { grid-template-columns: 1fr; text-align: left; padding: 18px; }
  .team-hero__pet { flex-direction: row; justify-content: flex-start; }
  .team-hero__pet .pet { height: 80px; }
  .team-hero h1 { font-size: 26px; }
  .steps { grid-template-columns: 1fr 1fr; }
  .pet-pick { grid-template-columns: repeat(3, 1fr); }
  .roles-edit label { grid-template-columns: auto 1fr; }
  .roles-edit label input { grid-column: 1 / -1; }
  .work__hero { padding: 14px; }
  .work__sec { padding: 18px 16px; }
  .timeline::before { left: 9px; }
  .timeline li { grid-template-columns: 1fr; gap: 0; padding-left: 28px; }
  .timeline li::before { left: 3px; }
  .timeline__when { text-align: left; }
}

/* ================================================================ 운영 */
.adm-stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.adm-stats div {
  display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: var(--r);
  background: var(--screen); color: var(--screen-ink); border: 3px solid var(--screen-line); box-shadow: 0 5px 0 var(--screen-shadow);
}
.adm-stats b { font-family: var(--pixel); font-weight: 400; font-size: 26px; color: var(--screen-hi); line-height: 1.2; }
.adm-stats span { font-size: 13px; font-weight: 700; }
.adm-stats small { font-size: 12px; color: var(--screen-dim); }
.adm-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.adm-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.adm-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
  padding: 10px 8px; border-bottom: 1px solid var(--line-soft); font-size: 14px;
}
a.adm-row:hover { background: color-mix(in srgb, var(--c, var(--green)) 8%, white); border-radius: 10px; }
.adm-cell { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.adm-cell--main { flex: 1 1 220px; }
.adm-cell--main b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adm-row--post .adm-cell--main { flex-direction: column; align-items: flex-start; gap: 2px; }
.adm-cell--mail { flex: 0 1 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.adm-cell--act { margin-left: auto; gap: 10px; }
.adm-code { font-family: var(--pixel); letter-spacing: 0.08em; min-width: 76px; }
.adm-row select { width: auto; min-height: 34px; padding: 4px 10px; font-size: 13px; }
.adm-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.ava-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.ava-pick label { cursor: pointer; border-radius: 50%; }
.ava-pick input { position: absolute; opacity: 0; pointer-events: none; }
.ava-pick .ava { width: 40px; height: 40px; }
.ava-pick input:checked + .ava { box-shadow: 0 0 0 3px var(--green-btn); }
.ava-pick input:focus-visible + .ava { outline: 3px solid rgba(78, 205, 196, 0.7); }
.adm-teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.adm-team { display: flex; flex-direction: column; gap: 10px; border-top: 6px solid var(--c); }
.adm-team__head { display: flex; align-items: center; gap: 8px; }
.adm-team__head input { flex: 1; min-width: 0; min-height: 36px; padding: 6px 10px; font-weight: 700; }
.adm-team__head select { width: auto; min-height: 36px; padding: 4px 8px; }
.adm-team__head .pet { height: 40px; max-width: 54px; }
.adm-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
.adm-line > span:first-child { flex: none; width: 92px; font-weight: 700; color: var(--ink-3); }
.adm-line select { flex: 1; width: auto; min-width: 0; min-height: 34px; padding: 4px 10px; font-size: 13px; }
.adm-members { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.adm-member { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 2px; border-radius: var(--pill); background: var(--green-50); font-size: 13px; }
.adm-team__foot { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); }
.adm-team__foot .link-btn--danger { margin-left: auto; }
.adm-url { font-family: var(--pixel); font-size: 12px; word-break: break-all; padding: 8px 10px; border-radius: 8px; background: var(--green-50); margin: 6px 0 10px; }
@media (max-width: 900px) { .adm-stats { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 560px) {
  .adm-stats { grid-template-columns: repeat(2, 1fr); }
  .adm-form { grid-template-columns: 1fr; }
  .adm-teams { grid-template-columns: 1fr; }
  .adm-cell--act { margin-left: 0; }
}

/* ================================================================ 사용법 */
.home-guide { margin: -6px 0 0; text-align: center; }
.disclosure .home-guide { margin: 0 0 16px; text-align: left; }
.guide { max-width: 860px; width: 100%; }
.guide-sec { display: flex; flex-direction: column; gap: 10px; }
.guide-sec h2 { display: flex; align-items: center; gap: 10px; font-size: 19px; }
.guide-no {
  flex: none; display: grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 8px;
  background: var(--screen); color: var(--screen-hi); font-family: var(--pixel); font-size: 14px; font-weight: 400;
  box-shadow: 0 3px 0 var(--screen-shadow);
}
.guide-steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; line-height: 1.7; }
.guide-steps li::marker { color: var(--green-700); font-weight: 700; }
.guide-go { align-self: flex-start; }
.guide .howto-steps { margin: 4px 0 0; }
.faq { margin: 0; display: flex; flex-direction: column; }
.faq > div { padding: 14px 4px; border-bottom: 1px solid var(--line-soft); }
.faq > div:last-child { border-bottom: 0; }
.faq dt { font-weight: 700; margin-bottom: 4px; }
.faq dt::before { content: 'Q. '; font-family: var(--pixel); color: var(--green-700); }
.faq dd { margin: 0; color: var(--ink-2); }
